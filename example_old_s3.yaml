esphome:
  name: chirphappens
  platformio_options:
    board_build.partitions: default.csv
    build_flags:
      - "-DBOARD_HAS_PSRAM"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  variant: ESP32S3
  framework:
    type: arduino

# Enable logging via USB
logger:
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
# Add an encryption key for secure communication: https://esphome.io/components/api/
api:

# Enable over the air updates
ota:
  - platform: esphome
    password: ""

# Default wifi configuration
wifi:
  # ssid: "Your WiFi SSID"
  # password: "VerySafePassword"

  # Enable fallback hotspot with captive portal in case wifi connection fails
  ap:
    ssid: "chirphappens"
    password: ""

captive_portal:

# External chirphappens component
# Either source from cloned repository or pull from GitHub
external_components:
  # - source: components
  - source:
      type: git
      url: https://github.com/chrizbee/ChirpHappens
      ref: main
    components: [ chirphappens ]

# ChirpHappens component with all available settings
binary_sensor:
  - platform: chirphappens
    name: "ChirpHappens"
    
    # Sequence of whistle frequencies in Hz
    # First value is absolute, all following values are relative to their previous value
    # Only the intervals have to match: Whistling higher or lower scales the whole sequence
    sequence: [1750, -400, 400]

    # Time from the start of one tone to the start of the next in ms
    pause_ms: 420

    # Tolerance of the first tone in Hz (default: max_delta_freq * 1.5)
    max_delta_base: 500

    # Tolerance of the following tones in Hz, relative to the first tone
    # Raising this will accept sloppier whistles, but also cause more false positives
    max_delta_freq: 180

    # Tolerance of pause_ms in ms
    max_delta_time: 300

    # Longest / shortest time between tones: Tones have to be evenly spaced
    max_rhythm: 2.0

    # Minimum number of frames of one tone
    # The time that is needed for the specified number of frames can be calculated like this
    # time = (buffer_size / sample_rate) * consecutive_detections
    consecutive_detections: 3

    # Longer tones in ms are not part of a sequence
    max_tone_ms: 1200

    # Peak amplitude threshold after FFT
    # 3e6 is about -80 dBFS, so whistles from another room are still detected
    # Purity and peak_to_mean keep noise out, so this can be low
    peak_threshold: 3e6

    # Ratio of peak amplitude to mean amplitude in the frequency band after FFT
    peak_to_mean: 4.0

    # Minimum share of the whole spectrum's energy that has to be in the peak (0 to 1)
    # A whistle is almost a pure sine, speech and music are not
    # This is the most important protection against false positives
    # Raise to 0.5 if there are false positives, lower for whistles from further away
    min_purity: 0.35

    # There must not be any other tone this close before the sequence in ms
    # This rejects melodies
    isolation_ms: 400

    # After a detection the sequence starts from scratch: The last tone and all tones
    # starting within this time in ms are discarded
    cooldown_ms: 500

    # Frequency range that is of intereset to us in Hz
    # Change this if your sequence exceeds this range
    start_freq: 1000.0
    end_freq: 2800.0

    # Reset pattern detected state after x ms
    reset_time: 300

    # Sampling rate for I2S microphone in Hz
    sample_rate: 8000

    # Buffer size = number of samples = FFT window size
    # The lower this value, the faster the computation ->
    #   decrease if: "Component chirphappens.binary_sensor took a long time for an operation"
    #   but: frequency_resolution = sample_rate / buffer_size
    buffer_size: 256

    # I2S pin configuration
    pin_i2s_ws: 11       # I2S WS pin
    pin_i2s_sck: 12      # I2S SCK pin
    pin_i2s_sd: 13       # I2S SD pin
    pin_i2s_lr: 14       # I2S L/R pin
    i2s_channel: left    # I2S channel
    i2s_port: I2S_NUM_0  # I2S port
